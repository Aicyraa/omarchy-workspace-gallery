    <rect x="-9" y="-6" width="18" height="12" rx="3" transform="translate(60 60) rotate(120) translate(36 0)"/>
    <rect x="-9" y="-6" width="18" height="12" rx="3" transform="translate(60 60) rotate(180) translate(36 0)"/>
    <rect x="-9" y="-6" width="18" height="12" rx="3" transform="translate(60 60) rotate(240) translate(36 0)"/>
    <rect x="-9" y="-6" width="18" height="12" rx="3" transform="translate(60 60) rotate(300) translate(36 0)"/>
